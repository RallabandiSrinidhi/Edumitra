<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUMITHRA - Login & Register</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">

  <div class="glass-card" style="width: 100%; max-width: 400px;">
    <h2 style="text-align: center; margin-bottom: 20px;">Welcome to EDUMITHRA</h2>
    
    <!-- Login Form -->
    <form id="auth-form" style="display: flex; flex-direction: column; gap: 15px;">
      <div>
        <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">Email Address</label>
        <input type="email" placeholder="student@example.com" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.2); color: white; outline: none;">
      </div>

      <div>
        <label style="display: block; margin-bottom: 5px; font-size: 0.9rem;">Password</label>
        <input type="password" placeholder="••••••••" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.2); color: white; outline: none;">
      </div>

      <button type="submit" class="btn-primary" style="margin-top: 10px;">Login</button>
    </form>

    <div style="text-align: center; margin-top: 15px; font-size: 0.85rem;">
      <p>Don't have an account? <a href="#" style="color: #fff; font-weight: bold;">Register</a></p>
      <p style="margin-top: 10px;"><a href="index.html" style="color: rgba(255, 255, 255, 0.7); text-decoration: none;">← Back to Home</a></p>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
